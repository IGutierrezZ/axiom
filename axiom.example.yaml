# ==============================================================================
# Plantilla de Configuración de Espacio de Trabajo Axiom
# ==============================================================================
# Este archivo define la identidad, topología y roles de desarrollo del proyecto.
# Renombra o copia este archivo como 'axiom.yaml' en la carpeta maestra local.
# Las claves del proyecto también se editan desde «Ajustes del proyecto» en `axiom ui`,
# que conserva los comentarios y valida el documento antes de escribir.

workspace:
  # Nombre identificador del proyecto
  name: "PlataformaEnterprise"

  # Topología del espacio de trabajo. Opciones admitidas:
  #   - monorepo-embedded: Código y especificaciones residen en el mismo repositorio Git.
  #   - multirepo: Uno o varios repositorios de código y repositorio canónico de specs OBLIGATORIO.
  topology: "multirepo"

  # Ruta relativa al repositorio canónico de especificaciones dentro de la carpeta maestra.
  # Para 'monorepo-embedded': usa "." o la subcarpeta interna (ej. "openspec" o "specs").
  # Para 'multirepo': debe ser el nombre de la carpeta del repo de specs.
  specs_repository: "especificacion"

  # Directorios versionados con skills canónicas fuera de "skills/" (opcional).
  # Rutas relativas a la carpeta maestra; se rechazan las absolutas, las que salen de ella y ".".
  # Se escanean justo después de "skills/" y antes de los directorios de cada agente (.claude, .gemini...),
  # así que una skill declarada aquí figura en AGENTS.md con su ruta versionada y no con una copia local.
  # skill_roots:
  #   - "internal/assets/skills"
  #   - "docs/skills"

  # Ruta raíz del workspace (por defecto: "." que corresponde a la carpeta maestra)
  root: "."

# ------------------------------------------------------------------------------
# Política de Ramas (opcional)
# ------------------------------------------------------------------------------
# Política versionada del proyecto. Sin este bloque, o sin una de sus claves, rigen
# los valores por defecto que se muestran. Ambos valores deben ser nombres de
# referencia git válidos y 'branch_prefix' no puede empezar ni terminar en "/".
# Una clave desconocida es un error. El modo de trabajo y la raíz de los worktrees
# NO se declaran aquí: son preferencias personales de cada usuario.
# git:
#   integration_branch: main
#   branch_prefix: feat
#   # main_branch: master
#   # promotion: branch
# Promoción en dos etapas (opcional): 'main_branch' es la rama principal a la que
# se promueve lo ya integrado; sin ella, o igual a la rama de integración, el
# trabajo se integra en una sola etapa. 'promotion' admite 'branch' (la rama del
# cambio sale de la principal: su primera PR va a la rama de integración y la segunda
# a 'main_branch'), 'release' (sale de la rama de integración; el paso a la principal
# es la release) y 'ask' (pregunta por cada cambio). Sin valor rige 'branch'; sin
# 'main_branch' no tiene efecto.

# ------------------------------------------------------------------------------
# Carril de Trabajo (opcional)
# ------------------------------------------------------------------------------
# Carril por el que el agente aborda el trabajo sustancial del proyecto:
#   odd: carril ágil; no se pregunta el carril (SDD solo si la persona lo pide).
#   sdd: carril formal; no se pregunta el carril. Es el valor por defecto.
#   ask: se conserva la pregunta bloqueante «ODD o SDD» en cada trabajo.
# Sin este bloque, o sin la clave 'lane', rige 'sdd'. El valor distingue
# mayúsculas y una clave desconocida es un error. El trabajo pequeño y entendido
# no abre ningún carril.
# workflow:
#   lane: ask

# ------------------------------------------------------------------------------
# Aviso de Cambio Grande (opcional)
# ------------------------------------------------------------------------------
# Umbral del aviso único y no bloqueante de cambio grande: cuando la previsión de
# líneas cambiadas de un cambio supera 'split_hint_lines', el agente avisa una vez
# de que la persona puede pedir PRs encadenadas y continúa sin esperar respuesta.
# Está desactivado por defecto: sin este bloque, o sin la clave, no hay aviso y no
# se cita ningún número. El valor debe ser un entero sin comillas mayor que cero y
# una clave desconocida es un error. El aviso nunca bloquea el trabajo.
# delivery:
#   split_hint_lines: 600

# ------------------------------------------------------------------------------
# Bloque SDD: modo ISO y patrón de identificadores (opcional)
# ------------------------------------------------------------------------------
# Un proyecto sometido a auditoría ISO declara que solo usa SDD:
#   iso: true   todo el trabajo, también el pequeño, va por el carril SDD sin
#               preguntar el carril y sin documento 'odd/tasks/'. Cada cambio
#               sellado copia la declaración en su 'kickoff.yaml' y exige
#               identificador válido según el patrón del proyecto (por defecto
#               REQ-<n>.<m>) y escenario en cada requisito, línea 'Cubre:' en las
#               tareas y una matriz de verificación válida y con éxito para
#               archivar. Un bug usa siempre el perfil de bug.
#   iso: false  es el valor por defecto; no cambia nada.
# No puede convivir con 'workflow.lane: odd': la validación lo rechaza. El valor
# debe ser un booleano sin comillas y una clave desconocida es un error.
#
# El patrón de los identificadores de requisito se declara con 'id_pattern', una
# plantilla de texto entre comillas; sin ella rige REQ-<n>.<m> (p. ej. RF-OLS-04).
# Marcadores: <DOM> código de dominio en mayúsculas (USU), <n> número de serie,
# <m> número de secuencia sin relleno y <NN> a <NNNNNN> número de secuencia con
# relleno a 2-6 cifras (<NN> da 01, 09, 10, 100). Debe empezar por un literal en
# mayúsculas con separador (RF-, HU-), llevar un único marcador de número y no
# juntar dos marcadores. Ejemplos: RF-<DOM>-<NN> (RF-USU-01), RF-<m> (RF-121),
# HU-<NNN> (HU-007). Una plantilla inválida es un error de 'axiom workspace
# validate' y los comandos que la necesitan se niegan con ese motivo.
#
# El HTML explicativo (un resumen con diagramas de la spec y del diseño para
# lectores no técnicos, 'resumen-spec.html' y 'resumen-design.html', que se ve en
# la pestaña «Explicación» del dashboard) se declara con 'explainer_html':
#   ask     es el valor por defecto; el orquestador pregunta una vez por cambio.
#   always  todo cambio nuevo lo genera, sin preguntar.
#   never   ningún cambio nuevo lo genera, sin preguntar.
# Cada cambio sella su decisión en 'kickoff.yaml'; lo que se aprueba sigue siendo
# el md. Un valor distinto de ask, always o never es un error de validación.
# sdd:
#   iso: true
#   id_pattern: "RF-<DOM>-<NN>"
#   explainer_html: ask

# ------------------------------------------------------------------------------
# Batería de Pruebas de Aceptación (opcional, solo multirepo)
# ------------------------------------------------------------------------------
# En una topología multirepo, 'sdd-tasks' puede generar 'pruebas.md', una batería de
# pruebas de aceptación manuales o automatizables que cubre los escenarios de las
# specs delta del cambio. Se activa con 'enabled: true' y declara los entornos en
# los que se prueba ('environments'). 'enabled: false' y la ausencia del bloque son
# equivalentes: no activan nada. Con 'enabled: true' fuera de multirepo,
# 'axiom workspace validate' falla. 'environments' no admite entradas vacías, con ';'
# ni repetidas. Se comprueba con 'axiom sdd tests check --change <cambio>'.
# acceptance_tests:
#   enabled: true
#   environments: [local, dev, pre]

# ------------------------------------------------------------------------------
# Integraciones con Trackers (opcional)
# ------------------------------------------------------------------------------
# Un proyecto puede conectar sus cambios con un tracker externo mediante plugins de
# integración. Cada plugin se declara por su identificador bajo 'integrations', con
# 'enabled' (por defecto true) y las claves que fija su manifiesto, cada una con su tipo.
# Los secretos (tokens, PAT, contraseñas) NUNCA se escriben aquí: se guardan con 'axiom integrations secret set' (valor por stdin) o en la variable de entorno
# AXIOM_INTEGRATION_<PLUGIN>_<SECRETO>.
# El catálogo de plugins es cerrado: en esta versión solo existe 'azure-devops'; declarar
# cualquier otro plugin es un error de carga.
# 'integrations: {}' es válido y no configura nada.
# Una clave desconocida, un tipo incorrecto o una clave obligatoria ausente son errores
# que 'axiom workspace validate' rechaza con su línea y las alternativas admitidas.
# El PAT de Azure DevOps es el secreto 'pat' (variable AXIOM_INTEGRATION_AZURE_DEVOPS_PAT): de
# una sola organización, con los scopes vso.work_write (work items; vso.work, que cubre las
# iteraciones, queda incluido), vso.project y vso.code. Nunca va aquí.
# Con el bloque configurado, 'axiom integrations connect --plugin azure-devops' prueba la conexión y
# guarda tu identidad en ~/.axiom, y 'axiom integrations discover --plugin azure-devops' imprime los
# tipos, estados, campos, iteraciones y miembros del proyecto.
# 'axiom change start --from <id|url>' arranca un cambio desde un work item: 'item_keys' lista los
# tipos de work item admitidos como Tipo=PREFIJO (el prefijo forma el nombre del cambio, p. ej.
# US-2525-alta-de-usuarios). Sin la clave vale ["User Story=US", "Bug=BUG"] (proceso Agile); en
# Scrum o Basic se configura con el tipo de ese proceso ("Product Backlog Item=PBI", "Issue=ISS").
# El perfil 'bug' solo se da al tipo que se llama literalmente 'Bug': un tipo de defecto con otro
# nombre (p. ej. 'Defect') arranca con perfil 'incremento'. '--from' acepta el identificador
# numérico o la URL del navegador (/_workitems/edit/<id>, la de la API o un tablero con
# '?workitem=<id>') de la organización y el proyecto configurados.
# Los manifiestos tienen un alias de referencia (ref_alias: 'ado' en azure-devops, solo informativo):
# la referencia externa del cambio es '<alias>:<id>', p. ej. 'ado:2525'.
# integrations:
#   azure-devops:
#     enabled: true
#     organization: contoso      # la de dev.azure.com/<organización>
#     project: Fabrikam
#     team: Fabrikam Team
#     item_keys:
#       - "User Story=US"
#       - "Bug=BUG"

# ------------------------------------------------------------------------------
# Ajustes de Ramas por Repositorio (opcional)
# ------------------------------------------------------------------------------
# Un repositorio puede sustituir la rama de integración o el prefijo del bloque
# 'git'. 'path' es obligatoria, relativa a la carpeta maestra y sin salir de ella;
# 'integration_branch' y 'branch_prefix' siguen las reglas de 'git' y, si faltan,
# el repositorio hereda el valor de 'git'. No puede haber dos entradas con la
# misma ruta. Una clave desconocida es un error.
# repositories:
#   - path: backend-api
#     integration_branch: release
#   - path: frontend-portal
#     branch_prefix: ui
#     promotion: ask
# 'promotion' (branch, release o ask) sustituye a git.promotion en ese repositorio.

# ------------------------------------------------------------------------------
# Contexto Técnico (opcional)
# ------------------------------------------------------------------------------
# Documentación técnica del proyecto que ya vive en el repositorio. La única spec
# viva de requisitos es OpenSpec (openspec/specs/); este bloque no declara una
# segunda spec, solo qué documentación acompaña al código:
#   maintained: la mantiene el archivado con un delta por cambio (context-impact.md)
#               y la integración de ODD; 'entry' es el documento de entrada.
#   reference:  solo lectura; ninguna fase de Axiom la modifica.
# Las rutas son relativas a la carpeta maestra y no pueden salir de ella. Con
# 'maintained' el almacén de artefactos debe ser openspec o hybrid. Se valida con
# 'axiom workspace validate' y se comprueba con 'axiom archive context check'.
# technical_context:
#   maintained:
#     entry: context/INDICE.md
#     paths: [context]
#   reference:
#     paths: [referencia]

# ------------------------------------------------------------------------------
# Definición de Roles de Implementación (de 1 a N roles)
# ------------------------------------------------------------------------------
roles:
  frontend:
    name: "Desarrollo Frontend Web"
    repositories:
      - path: "frontend-portal"
      - path: "design-system"
    tech:
      - "react"
      - "typescript"
      - "tailwind"

  backend:
    name: "Desarrollo Core API y Servicios"
    repositories:
      - path: "backend-api"
    tech:
      - "go"
      - "postgresql"
      - "redis"

  devops:
    name: "Infraestructura y Plataforma"
    repositories:
      - path: "infraestructura"
    tech:
      - "terraform"
      - "docker"
      - "github-actions"

# ------------------------------------------------------------------------------
# Gobernanza Transversal del Proyecto
# ------------------------------------------------------------------------------
governance:
  # Idioma oficial obligatorio para toda documentación, artefactos SDD y handoffs
  language: "es"

  # Motor de memoria compartida persistente
  shared_memory: "engram"
