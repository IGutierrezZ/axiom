# ==============================================================================
# Plantilla de Configuración de Espacio de Trabajo Axiom
# ==============================================================================
# Este archivo define la identidad, topología y roles de desarrollo del proyecto.
# Renombra o copia este archivo como 'axiom.yaml' en la carpeta maestra local.

workspace:
  # Nombre identificador del proyecto
  name: "PlataformaEnterprise"

  # Topología del espacio de trabajo. Opciones admitidas:
  #   - monorepo-embedded: Código y especificaciones residen en el mismo repositorio Git.
  #   - multirepo: Uno o varios repositorios de código y repositorio canónico de specs OBLIGATORIO.
  topology: "multirepo"

  # Ruta relativa al repositorio canónico de especificaciones dentro de la carpeta maestra.
  # Para 'monorepo-embedded': usa "." o la subcarpeta interna (ej. "openspec" o "specs").
  # Para 'multirepo': debe ser el nombre de la carpeta del repo de specs.
  specs_repository: "especificacion"

  # Directorios versionados con skills canónicas fuera de "skills/" (opcional).
  # Rutas relativas a la carpeta maestra; se rechazan las absolutas, las que salen de ella y ".".
  # Se escanean justo después de "skills/" y antes de los directorios de cada agente (.claude, .gemini...),
  # así que una skill declarada aquí figura en AGENTS.md con su ruta versionada y no con una copia local.
  # skill_roots:
  #   - "internal/assets/skills"
  #   - "docs/skills"

  # Ruta raíz del workspace (por defecto: "." que corresponde a la carpeta maestra)
  root: "."

# ------------------------------------------------------------------------------
# Política de Ramas (opcional)
# ------------------------------------------------------------------------------
# Política versionada del proyecto. Sin este bloque, o sin una de sus claves, rigen
# los valores por defecto que se muestran. Ambos valores deben ser nombres de
# referencia git válidos y 'branch_prefix' no puede empezar ni terminar en "/".
# Una clave desconocida es un error. El modo de trabajo y la raíz de los worktrees
# NO se declaran aquí: son preferencias personales de cada usuario.
# git:
#   integration_branch: main
#   branch_prefix: feat

# ------------------------------------------------------------------------------
# Ajustes de Ramas por Repositorio (opcional)
# ------------------------------------------------------------------------------
# Un repositorio puede sustituir la rama de integración o el prefijo del bloque
# 'git'. 'path' es obligatoria, relativa a la carpeta maestra y sin salir de ella;
# 'integration_branch' y 'branch_prefix' siguen las reglas de 'git' y, si faltan,
# el repositorio hereda el valor de 'git'. No puede haber dos entradas con la
# misma ruta. Una clave desconocida es un error.
# repositories:
#   - path: backend-api
#     integration_branch: release
#   - path: frontend-portal
#     branch_prefix: ui

# ------------------------------------------------------------------------------
# Definición de Roles de Implementación (de 1 a N roles)
# ------------------------------------------------------------------------------
roles:
  frontend:
    name: "Desarrollo Frontend Web"
    repositories:
      - path: "frontend-portal"
      - path: "design-system"
    tech:
      - "react"
      - "typescript"
      - "tailwind"

  backend:
    name: "Desarrollo Core API y Servicios"
    repositories:
      - path: "backend-api"
    tech:
      - "go"
      - "postgresql"
      - "redis"

  devops:
    name: "Infraestructura y Plataforma"
    repositories:
      - path: "infraestructura"
    tech:
      - "terraform"
      - "docker"
      - "github-actions"

# ------------------------------------------------------------------------------
# Gobernanza Transversal del Proyecto
# ------------------------------------------------------------------------------
governance:
  # Idioma oficial obligatorio para toda documentación, artefactos SDD y handoffs
  language: "es"

  # Motor de memoria compartida persistente
  shared_memory: "engram"

  # Conector para análisis semántico del código
  semantic_analysis: "serena"
