# Tabla de contexto de la migración de identificadores (C-03-e, D3 regla 5). Resuelve los IDs
# antiguos ambiguos que ninguna regla automática decide: cada entrada fija la capacidad de un
# token en un fichero, con la evidencia que la justifica. Solo se aplica si la capacidad figura
# entre las candidatas del token en openspec/id-map.yaml.
schema: axiom.id-contexts/v1
entries:
