workspace:
  name: "Axiom"
  topology: "monorepo-embedded"
  specs_repository: "openspec"
  skill_roots:
    - "internal/assets/skills"
  root: "."

# Política de ramas del proyecto (RF-BRA-25, RF-TOP-09): los cambios de este
# repositorio se integran en main y sus ramas llevan el prefijo inc.
git:
  integration_branch: "main"
  branch_prefix: "inc"

# Carril de trabajo del proyecto (RF-TOP-11): este repositorio conserva la pregunta
# «ODD o SDD» en cada trabajo sustancial.
workflow:
  lane: "ask"

# Patrón de identificadores de requisito propio de Axiom (C-03-e).
sdd:
  id_pattern: "RF-<DOM>-<NN>"

roles:
  fullstack:
    name: "Axiom Fullstack Engine"
    repositories:
      - path: "."
    tech:
      - "go"

governance:
  language: "es"
  shared_memory: "engram"
