workspace:
  name: "Axiom"
  topology: "monorepo-embedded"
  specs_repository: "openspec"
  skill_roots:
    - "internal/assets/skills"
  root: "."

# Política de ramas del proyecto (REQ-25.24, REQ-25.26): los cambios de este
# repositorio se integran en main y sus ramas llevan el prefijo inc.
git:
  integration_branch: "main"
  branch_prefix: "inc"

# Carril de trabajo del proyecto (REQ-27.1): este repositorio conserva la pregunta
# «ODD o SDD» en cada trabajo sustancial.
workflow:
  lane: "ask"

roles:
  fullstack:
    name: "Axiom Fullstack Engine"
    repositories:
      - path: "."
    tech:
      - "go"
      - "bubbletea"

governance:
  language: "es"
  shared_memory: "engram"
