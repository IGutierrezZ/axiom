name: PR Validation

on:
  pull_request:
    # Sin `edited` (C-08-k): las dos comprobaciones (una sola etiqueta `type:*`
    # y autor de confianza o `safe:external`) no miran ni el título ni la
    # descripción, así que editarlos no puede cambiar el resultado.
    # `unlabeled` se queda: quitar una etiqueta sobrante o `safe:external`
    # tiene que revalidar.
    types: [opened, synchronize, labeled, unlabeled]

# Una ejecución nueva deja obsoleta a la anterior del mismo disparador sobre la
# misma referencia, así que se cancela en lugar de encolarse detrás. El nombre
# del evento forma parte de la clave para que una etiqueta no cancele la
# validación de un push a la PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has exactly one type:* label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const labels = pr.labels.map(l => l.name);
            const typeLabels = labels.filter(l => l.startsWith('type:'));

            console.log(`All PR labels: ${labels.join(', ') || '(none)'}`);
            console.log(`type:* labels found: ${typeLabels.join(', ') || '(none)'}`);

            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n\n' +
                'Valid labels:\n' +
                '  type:bug, type:feature, type:refactor,\n' +
                '  type:docs, type:chore, type:breaking-change\n\n' +
                'Ask a maintainer to add the appropriate label.'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(
                `❌ PR has ${typeLabels.length} type:* labels: ${typeLabels.join(', ')}\n` +
                'A PR must have exactly ONE type:* label. Please remove the extra one(s).'
              );
            } else {
              console.log(`✅ PR has type label: ${typeLabels[0]}`);
            }

  check-trusted-author:
    name: Verify PR Origin & Authority
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR author
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const trustedAuthors = ['igutierrezz', 'igutierrezz-hiberuscom'];
            const author = (pr.user && pr.user.login ? pr.user.login : '').toLowerCase();
            const labels = (pr.labels || []).map(l => (l.name || '').toLowerCase());
            const isAuthorizedExternal = labels.includes('safe:external');

            console.log(`PR Author: ${pr.user ? pr.user.login : 'unknown'}`);
            console.log(`PR Labels: ${labels.join(', ') || '(none)'}`);

            if (trustedAuthors.includes(author)) {
              console.log('✅ Autor de confianza verificado (propietario / colaborador principal).');
              return;
            }

            if (isAuthorizedExternal) {
              console.log('✅ PR externa autorizada expresamente mediante la etiqueta "safe:external".');
              return;
            }

            core.setFailed(
              `⛔ PR EXTERNA BLOQUEADA: Creada por @${pr.user ? pr.user.login : 'desconocido'}.\n\n` +
              'Por seguridad contra merges accidentales de automatizaciones e IA,\n' +
              'este PR requiere revisión explícita del propietario.\n' +
              'Para autorizar su merge, @IGutierrezZ debe revisar el código y aplicar la etiqueta "safe:external".'
            );

