name: Windows Full Suite

# Deliberately its own workflow, not a job in ci.yml.
#
# Until 2026-07-29 this suite never once completed: windows-runtime declared a
# 30-minute job timeout around a 35-minute step, so every push to main was
# cancelled at 30m and reported the whole run cancelled. v2.2.0 shipped without
# these tests ever having run. Unblocking them surfaced eighteen genuine
# Windows failures that predate the release.
#
# Keeping the lane inside ci.yml would make that pre-existing debt block
# publication, because the release gate requires a green ci.yml run on the
# exact tagged commit. Running it here instead keeps the signal visible and
# lets the debt be paid down without holding releases hostage to it. This is
# not a permanent home: once the eighteen are fixed, fold this back into ci.yml
# so it gates again.
#
# Everything below is otherwise identical to the ci.yml job it replaces.
#
# Cuándo se ejecuta. Son 10 shards de ~30 min en runners Windows, que cuestan el
# doble, así que no se lanza en cada push. A diferencia del job windows-runtime
# de ci.yml, no reacciona a los cambios de ruta: solo corre
#   - a mano (workflow_dispatch);
#   - en un PR con la etiqueta `ci:windows`: al añadirla, y después en cada
#     push (synchronize) o reapertura mientras la lleve. Esta es también la vía
#     para una etiqueta añadida tras abrir el PR, porque ci.yml no escucha
#     `labeled` y relanzar todos sus jobs por una etiqueta sería un gasto inútil;
#   - cada lunes a las 03:20 UTC, y solo si `main` tiene commits que ninguna
#     ejecución correcta ha cubierto todavía. Una semana sin commits nuevos no
#     gasta ningún minuto de Windows.
# El job `gate` decide todo esto en un runner Linux de segundos; los shards solo
# se crean si `gate` da luz verde.

on:
  workflow_dispatch:
  # `labeled` por la etiqueta; `synchronize` y `reopened` para seguir ejecutando
  # un PR que ya la lleva. Cualquier otra etiqueta u otro evento sobre un PR sin
  # `ci:windows` termina en `gate` sin lanzar nada.
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: '20 3 * * 1'

permissions:
  contents: read

# Una ejecución nueva deja obsoleta a la anterior del mismo disparador sobre la
# misma referencia, así que se cancela en lugar de encolarse detrás. El nombre
# del evento forma parte de la clave para que un PR etiquetado no cancele la
# ejecución semanal ni un workflow_dispatch manual, que es la única vía de re-ejecutar
# cuando el fichero del workflow ha cambiado. Un `labeled` de otra etiqueta que
# no es `ci:windows` no hace trabajo real, así que se le da una clave propia
# (con el id de la ejecución): no puede cancelar una ejecución real en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:windows') && github.run_id || '' }}
  cancel-in-progress: true

# Las pruebas que compilan y ejecutan binarios propios se omiten por defecto
# porque el EDR de los equipos de desarrollo los bloquea. La CI las ejecuta
# todas, así que lo activa de forma explícita.
env:
  AXIOM_TEST_BUILD_BINARIES: "1"

jobs:
  # Puerta barata en Linux: decide si hay que gastar minutos de Windows. Aplica
  # a todos los disparadores, pero solo `schedule` consulta el historial.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo lee el historial de ejecuciones (`gh run list`); sin checkout.
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether the shards run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_ADDED: ${{ github.event.label.name }}
          PR_HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows') }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          decide() {
            case "$EVENT_NAME" in
              workflow_dispatch)
                echo true 'manual run'
                ;;
              pull_request)
                # `labeled` de otra etiqueta no cuenta aunque el PR ya lleve
                # `ci:windows`: solo reacciona la propia `ci:windows`.
                if [ "$EVENT_ACTION" = labeled ]; then
                  if [ "$LABEL_ADDED" = 'ci:windows' ]; then
                    echo true 'ci:windows label added'
                  else
                    echo false "label '$LABEL_ADDED' is not ci:windows"
                  fi
                elif [ "$PR_HAS_LABEL" = true ]; then
                  echo true "PR carries ci:windows ($EVENT_ACTION)"
                else
                  echo false "PR does not carry ci:windows ($EVENT_ACTION)"
                fi
                ;;
              schedule)
                # Falla abierto: si no se puede consultar el historial, o no
                # hay ninguna ejecución correcta en main, se ejecuta.
                if ! last="$(gh run list --workflow windows-full-suite.yml --branch main \
                  --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"; then
                  echo true 'could not read the run history'
                elif [ -z "$last" ]; then
                  echo true 'no successful run on main yet'
                elif [ "$last" = "$CURRENT_SHA" ]; then
                  echo false "main has no new commits since the last successful run ($last)"
                else
                  echo true "main moved from $last to $CURRENT_SHA"
                fi
                ;;
              *)
                echo true "unexpected event $EVENT_NAME"
                ;;
            esac
          }

          read -r run reason < <(decide)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run: $reason"
          echo "run=$run: $reason" >> "$GITHUB_STEP_SUMMARY"

  # Coverage is identical to running the suite in one job -- every package runs
  # on every run that gets past the gate -- but wall-clock is set by the slowest
  # shard rather than the sum.
  #
  # Sharding, not test selection: the shards are content-independent, so a
  # change is never the reason a package does or does not run. Selecting tests
  # from the diff would break exactly the case this repo keeps hitting, where a
  # change in one package fails a ratchet or contract test that lives in
  # another.
  #
  # Split by measured cost: internal/cli and internal/reviewtransaction are
  # ~44% and ~33% of total test time. internal/cli alone exceeded the 30m
  # go-test timeout, so it takes six shards. `rest` is derived from `go list`
  # rather than listed, so a new package is covered the day it is added.
  #
  # The first cut of this split tiled A-Z by first letter, which is cost-blind:
  # cli-d-q reached 1818s and cli-r-a-m 1692s against a 1800s go-test timeout
  # while cli-r-n-z finished in 143s. Test names cluster by prefix, and cost
  # clusters with them, so a first-letter tile cannot be balanced -- 423 of the
  # 649 TestR* tests are TestReview*, a single indivisible letter. The shards
  # below are sized from measured per-selector cost instead (Linux seconds,
  # which Windows tracks at a steady ~20x across every shard in the matrix):
  #
  #   cli-a-m         33.5s   cli-review-a-m  41.1s
  #   cli-n-o         46.1s   cli-review-n-z  34.9s
  #   cli-p-q-s-z     48.6s   cli-r-other     14.3s
  #
  # That puts the worst shard near 1000s on Windows, roughly half the go-test
  # timeout, instead of 1% over it.
  #
  # Intra-package t.Parallel() would be the deeper fix, but internal/cli has 89
  # os.Setenv/t.Setenv sites and t.Setenv panics in a parallel test, so that is
  # a refactor of shared global state and not a CI change.
  windows-full-suite:
    name: Windows Full Suite (${{ matrix.shard.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Selectors are free-form -run regexes, not a letter tiling, so they can
        # be sized by cost. internal/assets checks them against the real
        # `go test -list` inventory of each package and fails unless every test
        # is claimed by exactly one shard, so a shard cannot leave tests unrun
        # and silently report the lane green.
        shard:
          - name: cli-a-m
            packages: ./internal/cli
            run: ^Test[A-M]
          - name: cli-n-o
            packages: ./internal/cli
            run: ^Test[N-O]
          - name: cli-p-q-s-z
            packages: ./internal/cli
            run: ^Test[P-Q]|^Test[S-Z]
          - name: cli-review-a-m
            packages: ./internal/cli
            run: ^TestReview[A-Ma-m]
          - name: cli-review-n-z
            packages: ./internal/cli
            run: ^TestReview[N-Zn-z]
          # Every TestR* that the two cli-review shards do not claim: the
          # non-Review TestRe* tests, TestRevision* (TestRevi + s, where
          # TestReview is TestRevi + e), and TestRo*/TestRu*. The empty
          # ^TestR[A-Da-d] arm keeps the R space fully tiled for names nobody
          # has written yet.
          - name: cli-r-other
            packages: ./internal/cli
            run: ^TestR[A-Da-d]|^TestRe[A-Ua-u]|^TestRevi[N-Zn-z]|^TestR[F-Zf-z]
          - name: reviewtransaction-a-c
            packages: ./internal/reviewtransaction
            run: ^Test[A-C]
          - name: reviewtransaction-d-k
            packages: ./internal/reviewtransaction
            run: ^Test[D-K]
          - name: reviewtransaction-l-z
            packages: ./internal/reviewtransaction
            run: ^Test[L-Z]
          - name: rest
            packages: ""
            run: ""
    steps:
      # This suite is process- and filesystem-bound, not CPU-bound: it spawns
      # git constantly and builds throwaway repositories under TEMP. Defender
      # scans every one of those writes and every spawned image, which is the
      # single largest reason the same suite takes ~5m on Linux and far longer
      # here. Exclusions are scoped to the two trees the run owns and last only
      # for the life of the ephemeral runner.
      #
      # Best-effort on purpose: Defender policy can refuse the call on a
      # hardened image, and a CI lane must not go red because an optimisation
      # was unavailable.
      - name: Exclude runner work and temp trees from Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'git.exe','go.exe','gentle-ai.exe' -ErrorAction SilentlyContinue

      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # En un PR se prueba su cabeza, como hace ci.yml, y no la referencia de
          # fusión que es `github.sha` en ese evento.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run shard
        shell: pwsh
        timeout-minutes: 35
        run: |
          if ('${{ matrix.shard.packages }}' -ne '') {
            $packages = @('${{ matrix.shard.packages }}')
          } else {
            $packages = go list ./... | Where-Object {
              $_ -notmatch '/internal/cli$' -and $_ -notmatch '/internal/reviewtransaction$'
            }
          }
          if (-not $packages) { throw 'shard resolved to no packages' }
          $selector = '${{ matrix.shard.run }}'
          $arguments = @('test') + $packages + @('-count=1', '-timeout=30m')
          if ($selector -ne '') { $arguments += @('-run', $selector) }
          # A range shard that matches nothing is a silent hole: the shard
          # passes, the letters it owned never ran, and the lane is green.
          # Count first and fail loudly instead.
          if ($selector -ne '') {
            $selected = (go test $packages[0] -list $selector | Where-Object { $_ -match '^Test' }).Count
            Write-Host "shard ${{ matrix.shard.name }}: $selected test(s) match $selector"
            if ($selected -eq 0) { throw "shard selector $selector matched no test" }
          } else {
            Write-Host "shard ${{ matrix.shard.name }}: $($packages.Count) package(s)"
          }
          go @arguments
          exit $LASTEXITCODE
