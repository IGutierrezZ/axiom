name: CI

on:
  pull_request:
  # Sin `push` a `main` (C-08-k, P24): la batería completa ya pasó en la PR, así
  # que tras fusionar solo corre una vez al día, de noche, y solo si `main` tiene
  # commits que ninguna ejecución correcta ha cubierto. La puerta está en el job
  # `changes`.
  schedule:
    - cron: '40 2 * * *'
  # Manual re-run. `gh run rerun` refuses a run whose workflow file has changed
  # since, which is exactly when a re-run is needed most: a known-flaky failure
  # on a commit that is otherwise ready to tag, right after the workflow moved.
  # Without this the only way to re-run CI on main is to push another commit.
  # It is also how a sha gets the green ci.yml run that the release gate
  # requires before it is tagged: `gh workflow run ci.yml --ref main`.
  # Sin `full`, la ejecución manual corre los mismos jobs que una PR y es la
  # que valida el sha antes de etiquetar. Con `-f full=true` añade los jobs
  # pesados (Darwin Runtime, Organic Runtime E2E y E2E en contenedores), que
  # no forman parte de la puerta de release.
  workflow_dispatch:
    inputs:
      full:
        description: "Añadir Darwin Runtime, Organic Runtime E2E y los E2E en contenedores"
        type: boolean
        default: false

# Una ejecución nueva deja obsoleta a la anterior del mismo disparador sobre la
# misma referencia, así que se cancela en lugar de encolarse detrás. El nombre
# del evento forma parte de la clave para que un PR no cancele la ejecución
# nocturna ni un workflow_dispatch manual, que es la única vía de re-ejecutar
# cuando el fichero del workflow ha cambiado o de validar un sha antes de
# etiquetarlo (scripts/require-ci-success.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Las pruebas que compilan y ejecutan binarios propios se omiten por defecto
# porque el EDR de los equipos de desarrollo los bloquea. La CI las ejecuta
# todas, así que lo activa de forma explícita.
#
# TOOLCHAIN_META_TESTS es el único selector de los meta-tests que compilan o
# lanzan el toolchain de Go (C-08-k). `Go Tests` los omite con `-skip` y
# `Toolchain Meta Tests` los ejecuta con `-run`, así que un nombre no puede
# quedar fuera de los dos jobs. internal/assets comprueba que esos nombres
# solo se declaran en los paquetes del job nuevo y que todo test de esos
# paquetes que lanza el toolchain está en el selector.
env:
  AXIOM_TEST_BUILD_BINARIES: "1"
  TOOLCHAIN_META_TESTS: '^(TestDocumentedInvocationsRunAsDocumented|TestBuiltBinaryClosedStdinRefusesBeforeBubbleTea|TestWindowsFullSuiteShardsCoverEveryTestName|TestCanonicalReleasePublicKeysControlRealLinkerBuild|TestReleaseDistributionPolicyAssertionFailsClosed|TestReleaseDistributionPolicyAcceptsSemanticYAMLFormatting|TestModifiedReleaseVerifierCannotGainWriteAuthority)$'

jobs:
  # Este job, go-format, unit-tests y sus jobs hijos se omiten en un PR
  # que solo toca artefactos de planificación (salida `artifacts_only` del job
  # `changes`). Un job omitido cuenta como superado para un check obligatorio;
  # un workflow filtrado por rutas, en cambio, deja el check esperando.
  opencode-v2-contracts:
    name: OpenCode V2 Released SDK Contracts
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Typecheck V2 assets against released 2.0.4
        run: bash scripts/test-opencode-v2-contracts.sh

  go-format:
    name: Go Format
    needs: changes
    # `!cancelled()` y no el `success()` implícito: si `changes` falla, el
    # formato se comprueba igualmente en lugar de omitirse.
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: go run ./internal/gofmtcheck

  # Decide si el diff toca algo que solo existe para Windows o que decide su
  # comportamiento. Se hace aquí, con git, y no con una acción de terceros de
  # detección de cambios: el workflow no depende de nada que no esté fijado por
  # SHA. No filtra por paquete: 46 paquetes tienen código específico de Windows
  # (internal/cli entre ellos) y cambian a menudo, así que filtrar por paquete
  # equivaldría a ejecutar casi siempre. La suite completa de Linux sigue
  # corriendo en cada PR y cubre los contratos entre paquetes.
  #
  # Falla abierto: si no se puede calcular el diff, o la referencia anterior ya
  # no existe (rama nueva, force push), el resultado es `true`. Un cálculo roto
  # nunca debe dejar Windows sin ejecutar en silencio.
  #
  # Decide también `artifacts_only`: `true` solo en un PR cuyos ficheros están
  # todos bajo `odd/`, `openspec/` o `docs/plan/` (documentos ODD, cambios SDD,
  # sus archivados, la spec viva que actualiza el archivado y el plan maestro).
  # Entonces se omiten las pruebas, para que corregir un estado olvidado no
  # espere a la suite completa. Ninguna prueba lee `odd/` ni `docs/plan/`, y las
  # que leen el `openspec/` real dependen de cambios archivados hace tiempo. El
  # resto de `docs/` no entra: hay pruebas que leen documentación real. Fuera de
  # un PR nunca es `true`. Ante cualquier duda (diff roto, PR vacío, etiqueta
  # `ci:windows`, que exige go-format) el resultado es `false`.
  #
  # Decide también `up_to_date`: `true` solo en la nocturna (`schedule`) cuando
  # el último `headSha` en verde de este workflow en `main` es el actual. Es la
  # misma puerta que windows-full-suite.yml, y entonces se omiten todos los
  # jobs. Si `main` se ha movido, el diff para Windows va del último sha en verde
  # al actual, como hacía el push. Falla abierto: sin historial legible, o sin
  # ninguna ejecución correcta en `main`, se ejecuta todo.
  #
  # Decide también `toolchain`: `true` cuando hay que ejecutar los meta-tests
  # del toolchain. En un PR, solo si toca sus entradas (workflows,
  # `.goreleaser.yaml`, `internal/update/`, `scripts/`, `cmd/axiom/`, la
  # documentación de comandos que lee TestDocumentedInvocationsRunAsDocumented,
  # `go.mod`, `go.sum` o los propios ficheros de los meta-tests); en la
  # nocturna con commits nuevos, a mano o fallando abierto, siempre.
  changes:
    name: Detect Windows-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo lee la historia y, en la nocturna, el historial de ejecuciones; no
    # necesita más permisos ni conservar credenciales.
    permissions:
      contents: read
      actions: read
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
      artifacts_only: ${{ steps.detect.outputs.artifacts_only }}
      up_to_date: ${{ steps.detect.outputs.up_to_date }}
      toolchain: ${{ steps.detect.outputs.toolchain }}
    steps:
      # Checkout por defecto, no el del candidato: en un PR es la referencia de
      # fusión del repositorio base, que contiene el SHA base y el del PR aunque
      # el PR venga de un fork, y aquí no se ejecuta código del PR, solo se lee
      # su lista de ficheros. fetch-depth 0 trae la historia que necesita el diff.
      - name: Checkout history for the diff
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes that need Windows
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HAS_WINDOWS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows') }}
        run: |
          # Un fichero justifica ejecutar Windows. El `*` de `case` también
          # cruza `/`, así que `*_windows.go` equivale a `**/*_windows.go`.
          is_windows_file() {
            case "$1" in
              *_windows.go | *_windows_test.go | *_other.go | *_unix.go) return 0 ;;
              go.mod | go.sum) return 0 ;;
              .github/workflows/ci.yml | .github/workflows/windows-full-suite.yml) return 0 ;;
              scripts/*/*) return 1 ;; # scripts/*.ps1 no es recursivo
              scripts/*.ps1) return 0 ;;
            esac
            return 1
          }

          # Un artefacto de planificación: documentos ODD y cambios SDD, activos
          # o archivados, la spec viva que actualiza el archivado y el plan
          # maestro del backlog.
          is_planning_artifact() {
            case "$1" in
              odd/* | openspec/* | docs/plan/*) return 0 ;;
            esac
            return 1
          }

          # Una entrada de los meta-tests del toolchain (TOOLCHAIN_META_TESTS).
          # docs/audits queda fuera: TestDocumentedInvocationsRunAsDocumented
          # no la lee.
          is_toolchain_input() {
            case "$1" in
              docs/audits/*) return 1 ;;
              .github/workflows/* | .goreleaser.yaml | go.mod | go.sum) return 0 ;;
              internal/update/* | scripts/* | cmd/axiom/*) return 0 ;;
              docs/*.md | internal/assets/*.md) return 0 ;;
              internal/app/documented_invocation_test.go | internal/app/tty_boundary_test.go) return 0 ;;
              internal/assets/formatter_ordering_test.go | internal/assets/workflow_shards_test.go) return 0 ;;
            esac
            return 1
          }

          fail_open() {
            echo "::warning::$1; running the Windows lane and every check."
            echo 'windows=true' >> "$GITHUB_OUTPUT"
            echo 'artifacts_only=false' >> "$GITHUB_OUTPUT"
            echo 'up_to_date=false' >> "$GITHUB_OUTPUT"
            echo 'toolchain=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              echo 'windows=true' >> "$GITHUB_OUTPUT"
              echo 'artifacts_only=false' >> "$GITHUB_OUTPUT"
              echo 'up_to_date=false' >> "$GITHUB_OUTPUT"
              echo 'toolchain=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              # Tres puntos: se compara contra el ancestro común, es decir, solo
              # lo que aporta el PR aunque la base haya avanzado.
              range="$PR_BASE_SHA...$PR_HEAD_SHA"
              ;;
            schedule)
              if ! last="$(gh run list --workflow ci.yml --branch main \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"; then
                fail_open 'could not read the run history'
              fi
              if [ -z "$last" ]; then
                fail_open 'no successful run on main yet'
              fi
              if [ "$last" = "$CURRENT_SHA" ]; then
                echo "main has no new commits since the last successful run ($last); every job is skipped."
                echo 'windows=false' >> "$GITHUB_OUTPUT"
                echo 'artifacts_only=false' >> "$GITHUB_OUTPUT"
                echo 'up_to_date=true' >> "$GITHUB_OUTPUT"
                echo 'toolchain=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "main moved from $last to $CURRENT_SHA"
              range="$last..$CURRENT_SHA"
              ;;
            *)
              fail_open "unexpected event $EVENT_NAME"
              ;;
          esac

          # --no-renames: un fichero renombrado aparece con sus dos rutas, así
          # que sacar un *_windows.go de su sitio también cuenta.
          if ! files="$(git -c core.quotepath=off diff --name-only --no-renames "$range")"; then
            fail_open "could not diff $range (force push or missing history)"
          fi

          relevant=false
          artifacts_only=true
          toolchain=false
          count=0
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            count=$((count + 1))
            if is_windows_file "$file"; then
              echo "Windows-relevant: $file"
              relevant=true
            fi
            if ! is_planning_artifact "$file"; then
              artifacts_only=false
            fi
            if is_toolchain_input "$file"; then
              echo "Toolchain meta-test input: $file"
              toolchain=true
            fi
          done <<< "$files"

          # Sin ficheros nada demuestra que el PR sea solo de artefactos; fuera
          # de un PR, o con `ci:windows`, las pruebas corren siempre.
          if [ "$count" -eq 0 ] || [ "$EVENT_NAME" != pull_request ] || [ "$PR_HAS_WINDOWS_LABEL" = true ]; then
            artifacts_only=false
          fi
          # Fuera de un PR (la nocturna con commits nuevos) los meta-tests
          # corren siempre.
          if [ "$EVENT_NAME" != pull_request ]; then
            toolchain=true
          fi

          echo "windows=$relevant" >> "$GITHUB_OUTPUT"
          echo "artifacts_only=$artifacts_only" >> "$GITHUB_OUTPUT"
          echo 'up_to_date=false' >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "Compared $range ($count files): windows=$relevant artifacts_only=$artifacts_only toolchain=$toolchain"

  # `Unit Tests` era un único job secuencial; ahora sus pasos corren en jobs
  # paralelos y el agregador `unit-tests` conserva el nombre del check
  # obligatorio del ruleset de `main`. Los hijos solo esperan a `changes`, no a
  # `go-format`: arrancan a la vez que el formato y el agregador sigue fallando
  # si el formato falla. Con un PR solo de artefactos se omiten hijos y
  # agregador, y la omisión cuenta como superada para el check obligatorio.
  #
  # Grupos por coste medido en Linux (ejecución 45714038862, 2026-11-25):
  # internal/cli 97 s; app 62 s, assets 27 s y update 13 s; branch/engine 52 s y
  # components/sdd 49 s; el resto suma unos 120 s repartidos en muchos paquetes.
  # `rest` se deriva de `go list ./...` menos lo que nombra su `exclude`, así
  # que un paquete nuevo queda cubierto el día que se añade.
  # internal/assets comprueba que `exclude` es exactamente la unión de los
  # paquetes de los demás grupos: ni huecos ni paquetes repetidos.
  go-tests:
    name: Go Tests (${{ matrix.shard.name }})
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: cli
            packages: ./internal/cli
            exclude: ""
          - name: app-assets-update
            packages: ./internal/app ./internal/assets ./internal/update
            exclude: ""
          - name: engine-sdd
            packages: ./internal/branch/engine ./internal/components/sdd
            exclude: ""
          - name: rest
            packages: ""
            exclude: ./internal/cli ./internal/app ./internal/assets ./internal/update ./internal/branch/engine ./internal/components/sdd
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      # El grupo `rest` es `go test ./...` sin los paquetes de los otros grupos.
      # Los meta-tests del toolchain se omiten aquí y corren en
      # `toolchain-meta-tests` (TOOLCHAIN_META_TESTS, en el env del workflow).
      - name: Run unit tests
        env:
          SHARD_PACKAGES: ${{ matrix.shard.packages }}
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD_PACKAGES" ]; then
            read -ra packages <<< "$SHARD_PACKAGES"
          else
            # `go list` de un paquete que no existe falla, así que un `exclude`
            # obsoleto rompe el job en lugar de no excluir nada.
            read -ra excluded <<< "$SHARD_EXCLUDE"
            excluded_paths="$(go list "${excluded[@]}")"
            mapfile -t packages < <(go list ./... | grep -vxF -e "$excluded_paths")
          fi
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "FAIL: shard resolved to no packages" >&2
            exit 1
          fi
          echo "${#packages[@]} package(s)"
          go test "${packages[@]}" -skip "$TOOLCHAIN_META_TESTS"

      # Ninguna prueba debe escribir en el checkout ni dejar ficheros nuevos: con
      # el descubrimiento ascendente del planning home (inc-24), una prueba que
      # resuelve desde el directorio de su paquete llega a la raíz del
      # repositorio. Cada grupo compara con un árbol limpio.
      - name: Verify the checkout is clean after the unit tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: go test changed the checkout:" >&2
            git status --porcelain >&2
            git diff --stat >&2
            exit 1
          fi

  # Informative window -- cmd/axiom coverage (INC-20 F0, opened 2026-09-19)
  #
  # Blocking: init, project, change, workspace, handoff, role, skill,
  # semantic, archive, and ui in their help or no-argument form -- the
  # exclusive surface axiom-distribution-identity's build-identity
  # contract touches (REQ-20.15). The odd verb blocked here too until
  # this increment's Phase 11 (F6.2a) retired the `axiom odd` command
  # entirely; it no longer exists, so it no longer appears in this list
  # or in the smoke table below.
  #
  # init and ui use --help instead of the no-argument form: their
  # no-argument form is NOT inert, confirmed empirically in an isolated
  # directory while building this step, not assumed from reading the
  # source. `axiom init` with no arguments really scaffolds axiom.yaml,
  # openspec/specs/, openspec/changes/ and .axiom/inbox/skills/ under the
  # current directory (runInit -> hub.Initializer.Init). `axiom ui` with
  # no arguments starts a real HTTP server that blocks
  # (runUI -> dashboard.Server.ListenAndServe). Only their help form is
  # safe to run in a single foreground command. The trailing
  # `git status --porcelain` check is a second, independent guard: any
  # verb above that mutates the checkout fails this step loudly instead
  # of the mutation silently landing.
  #
  # Este job ya no va detrás de `go test`, así que el humo parte de un árbol
  # limpio y la guarda final compara con un árbol limpio.
  #
  # Successor: INC-21 (docs/ROADMAP.md). This window does not grow: any
  # new symptom belongs to the successor, not to this list.
  binary-smoke:
    name: Binary Smoke
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Smoke the canonical binary surface
        run: |
          go build -trimpath -o "$RUNNER_TEMP/axiom-canonical-smoke" ./cmd/axiom
          bin="$RUNNER_TEMP/axiom-canonical-smoke"
          # The retired gentle-ai entrypoint announced itself on stderr. The
          # canonical binary must never emit a retired/deprecated notice for the
          # old name, whatever its exact wording.
          notice_re="gentle-ai.*(retirad[oa]|deprecad[oa]|obsolet[oa]|deprecated|retired)|(retirad[oa]|deprecad[oa]|obsolet[oa]|deprecated|retired).*gentle-ai"

          smoke() {
            local label="$1" want_exit="$2"
            shift 2
            local err_file got_exit
            err_file="$(mktemp)"
            got_exit=0
            "$bin" "$@" >/dev/null 2>"$err_file" || got_exit=$?
            if [ "$got_exit" -ne "$want_exit" ]; then
              echo "FAIL: axiom $label exited $got_exit, want $want_exit" >&2
              cat "$err_file" >&2
              rm -f "$err_file"
              exit 1
            fi
            if grep -qiE "$notice_re" "$err_file"; then
              echo "FAIL: axiom $label emitted a retired/deprecated gentle-ai notice on stderr" >&2
              cat "$err_file" >&2
              rm -f "$err_file"
              exit 1
            fi
            rm -f "$err_file"
          }

          smoke "project"     1 project
          smoke "change"      1 change
          smoke "workspace"   1 workspace
          smoke "handoff"     1 handoff
          smoke "role"        1 role
          smoke "skill"       1 skill
          smoke "semantic"    1 semantic
          smoke "archive"     1 archive
          smoke "init --help" 0 init --help
          smoke "ui --help"   0 ui --help

          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: the canonical binary smoke changed the checkout:" >&2
            git status --porcelain >&2
            exit 1
          fi

  # Ratchet, not a clean gate: the repository already carries 230 functions
  # nothing reaches from main, most of them legitimate. This fails only when
  # a NEW one appears. It exists because InstallCommandsForDep survived with
  # no callers while the install docs described the dependency remediation
  # it would have performed. It blocks merges through the `Unit Tests`
  # aggregator, which requires this job to succeed: a guard that cannot block
  # a merge is decoration.
  deadcode-ratchet:
    name: Deadcode Ratchet
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check for new unreachable functions
        run: ./scripts/deadcode-ratchet.sh

  # Meta-tests que compilan o lanzan el toolchain de Go (C-08-k): los únicos de
  # la batería que dependen de los workflows, la release y la documentación de
  # comandos más que del código que cambia una PR normal. Corren aquí, con el
  # mismo selector que `Go Tests` omite, en la nocturna, a mano y en las PR
  # que tocan sus entradas (salida `toolchain` del job `changes`). Si `changes`
  # falla, corren igualmente.
  toolchain-meta-tests:
    name: Toolchain Meta Tests
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.up_to_date != 'true'
      && (needs.changes.result != 'success' || needs.changes.outputs.toolchain == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      # `-run` con un patrón que no casa nada sale con 0, y un meta-test omitido
      # también: el paso exige que al menos uno pase y que ninguno se omita.
      - name: Run toolchain meta-tests
        env:
          META_PACKAGES: ./internal/app ./internal/assets ./internal/update
        run: |
          set -euo pipefail
          read -ra packages <<< "$META_PACKAGES"
          log="$RUNNER_TEMP/toolchain-meta-tests.log"
          go test "${packages[@]}" -run "$TOOLCHAIN_META_TESTS" -count=1 -v | tee "$log"
          if grep -E '^--- SKIP: Test' "$log"; then
            echo "FAIL: a toolchain meta-test skipped instead of running" >&2
            exit 1
          fi
          passed="$(grep -cE '^--- PASS: Test' "$log" || true)"
          if [ "$passed" -eq 0 ]; then
            echo "FAIL: TOOLCHAIN_META_TESTS matched no test" >&2
            exit 1
          fi
          echo "$passed toolchain meta-test(s) passed"

      - name: Verify the checkout is clean after the meta-tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: go test changed the checkout:" >&2
            git status --porcelain >&2
            git diff --stat >&2
            exit 1
          fi

  # Agregador con el nombre del check obligatorio: no ejecuta pruebas, solo
  # exige que el formato y cada job hijo terminen en `success`. Un hijo
  # fallido, cancelado u omitido lo deja en rojo. La única omisión aceptada es
  # la de `toolchain-meta-tests` cuando `changes` decidió con éxito que la PR
  # no toca sus entradas.
  unit-tests:
    name: Unit Tests
    needs: [go-format, changes, go-tests, binary-smoke, deadcode-ratchet, toolchain-meta-tests]
    # `!cancelled()` en lugar de `always()` solo por la omisión de un PR de
    # artefactos: con go-format en rojo el job sigue corriendo y su primer paso
    # lo deja en rojo, así que un formato roto no se convierte en una omisión.
    if: >-
      !cancelled() && needs.changes.outputs.artifacts_only != 'true'
      && needs.changes.outputs.up_to_date != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1

      - name: Require every unit job to succeed
        env:
          GO_TESTS: ${{ needs.go-tests.result }}
          BINARY_SMOKE: ${{ needs.binary-smoke.result }}
          DEADCODE_RATCHET: ${{ needs.deadcode-ratchet.result }}
          TOOLCHAIN_META: ${{ needs.toolchain-meta-tests.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TOOLCHAIN_SELECTED: ${{ needs.changes.outputs.toolchain }}
        run: |
          failed=0
          for job in GO_TESTS BINARY_SMOKE DEADCODE_RATCHET TOOLCHAIN_META; do
            result="${!job}"
            echo "$job: $result"
            if [ "$job" = TOOLCHAIN_META ] && [ "$result" = skipped ] &&
              [ "$CHANGES_RESULT" = success ] && [ "$TOOLCHAIN_SELECTED" = false ]; then
              echo "TOOLCHAIN_META: not selected for this change"
              continue
            fi
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"

  windows-runtime:
    name: Windows Runtime
    needs: [go-format, changes]
    # Los runners Windows cuestan el doble, así que no corre en cada PR ni en
    # cada nocturna. Corre cuando:
    #   - se lanza a mano (workflow_dispatch);
    #   - el diff toca rutas de Windows (job `changes`): el de la PR o, en la
    #     nocturna, el de los commits nuevos de `main`;
    #   - el PR lleva la etiqueta `ci:windows`, que lo fuerza aunque el diff no
    #     toque esas rutas. Se lee la etiqueta que el PR tiene al abrirse,
    #     sincronizarse o reabrirse; una etiqueta añadida después la atiende
    #     windows-full-suite.yml, para que un `labeled` no relance todo este
    #     workflow.
    # `!cancelled()` y `needs.changes.result != 'success'` hacen que, si el
    # propio job `changes` falla, Windows se ejecute en lugar de omitirse en
    # silencio. El paso de abajo sigue cerrando el acceso si go-format falla.
    if: >-
      !cancelled() && (
      github.event_name == 'workflow_dispatch'
      || needs.changes.result != 'success'
      || needs.changes.outputs.windows == 'true'
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'ci:windows')))
    runs-on: windows-latest
    # Release blockers only; the full suite moved to windows-full-suite. Must
    # exceed the sum of its own step budgets, or a step can never reach its
    # limit -- the previous 30 here killed a 35-minute step at exactly 30m on
    # every push to main, reporting `cancelled` for the whole run and blocking
    # the release gate, while pull requests stayed green because the full
    # suite only ran on push and schedule.
    timeout-minutes: 20
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1

      # This suite is process- and filesystem-bound, not CPU-bound: it spawns
      # git constantly and builds throwaway repositories under TEMP. Defender
      # scans every one of those writes and every spawned image, which is the
      # single largest reason the same suite takes ~155s on Linux and over
      # 30m here. Exclusions are scoped to the two trees the run owns and last
      # only for the life of the ephemeral runner.
      #
      # Deliberately not `if: failure()`-guarded or made required: Defender
      # policy can refuse the call on a hardened image, and a CI lane must not
      # go red because an optimisation was unavailable. `-ErrorAction
      # SilentlyContinue` keeps it best-effort.
      - name: Exclude runner work and temp trees from Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'git.exe','go.exe','axiom.exe' -ErrorAction SilentlyContinue

      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run native Windows junction parent tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          $selector = '^(TestWriteFileAtomicFollowsDirectoryJunction|TestEnsureAtomicParentDirRejectsUnsafeDirectoryJunctionTargets|TestWriteFileAtomicRejectsJunctionLoop)$'
          $expected = @(
            'TestWriteFileAtomicFollowsDirectoryJunction'
            'TestEnsureAtomicParentDirRejectsUnsafeDirectoryJunctionTargets'
            'TestWriteFileAtomicRejectsJunctionLoop'
          )
          $selected = @(go test ./internal/components/filemerge -list $selector | Where-Object { $_ -match '^Test' })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list native Windows junction parent tests' }
          $missing = @($expected | Where-Object { $_ -notin $selected })
          if ($missing.Count -gt 0) { throw "Missing native Windows junction parent tests: $($missing -join ', ')" }
          go test -v ./internal/components/filemerge -count=1 -run $selector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Canonical package: these release-blocker tests read the product's own
      # behavior. The output is named axiom.exe, the same name the Defender exclusion
      # above and AXIOM_TEST_BINARY below use.
      - name: Build native test binary
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w -X main.version=ci" -o "$env:RUNNER_TEMP\axiom.exe" ./cmd/axiom

      - name: Run Windows release-blocker tests
        shell: pwsh
        timeout-minutes: 10
        env:
          AXIOM_TEST_BINARY: ${{ runner.temp }}\axiom.exe
        run: |
          $packages = @('./internal/fileprim', './internal/components/engram')
          $expected = @(
            'TestWindowsSecureOpenRetriesDirectDriveDeviceWithoutWeakeningFlags',
            'TestWindowsSecureOpenDriveFallbackFailsClosed',
            'TestWindowsSecureOpenDoesNotRetryOtherErrors',
            'TestStdioHandshake_TerminatesDescendantOnContextEnd',
            'TestStdioHandshake_PreservesEarlierDeadline',
            'TestStdioHandshake_PreservesCallerCancellation',
            'TestProbeStdio_MissingAbsoluteConfiguredCommandFails',
            'TestProbeStdio_MissingRelativeWindowsExecutableIsNotInstalled'
          )
          $selector = '^(' + [string]::Join('|', $expected) + ')$'
          $selected = @(go test $packages -list $selector | Where-Object { $_ -match '^Test' })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list Windows release-blocker tests' }
          $missing = @($expected | Where-Object { $_ -notin $selected })
          if ($missing.Count -gt 0) { throw "Missing Windows release-blocker tests: $($missing -join ', ')" }
          go test -v $packages -run $selector -count=1 -timeout=8m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # PR runs the release-blocker subset only; the full Windows suite runs
      # in the separate, honestly-named "Windows Full Suite" workflow.
  # Native Darwin release blockers (#1853). Four macOS defects (#1773, #1781,
  # #1804, #1850) and the #1872 RAR lock convoy shipped because no CI lane
  # executes Darwin semantics; GOOS=darwin cross-builds prove compilation, not
  # APFS aliasing, advisory-lock timing, or rename fallbacks. macOS runners
  # bill ~10x Linux minutes, so this job runs only the curated manifest in
  # scripts/darwin-release-blockers.manifest — tests whose failure mode is
  # platform-dependent — never the full suite. The full suite stays on Linux.
  #
  # REQUIRED FOR MERGE: the maintainer must add the status check
  # "Darwin Runtime" to the branch protection required status checks
  # (repository settings — this cannot be done from the workflow file).
  darwin-runtime:
    name: Darwin Runtime
    needs: go-format
    # Restringido a ejecución manual bajo demanda para evitar consumo masivo de runners macOS (factor 10x)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1

      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Fails loudly if any manifest entry names a test that no longer exists:
      # `go test -run` with a pattern matching nothing exits 0, which would rot
      # the manifest invisibly. Native `go test -list` here is authoritative,
      # including for //go:build darwin tests no other lane can even list.
      - name: Verify manifest against existing tests
        run: ./scripts/darwin-release-blockers.sh verify

      - name: Run Darwin release-blocker tests
        timeout-minutes: 20
        run: ./scripts/darwin-release-blockers.sh run

  organic-runtime-e2e:
    name: Organic Runtime E2E (${{ matrix.os }})
    needs: go-format
    # Restringido a ejecución manual bajo demanda para evitar consumo masivo en PRs cotidianos
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ${{ matrix.os }}
    # Issue #3185: the Windows suite legitimately runs 11-13 minutes; a 15m
    # go-test budget flaked on slow runners with every test passing. The job
    # limit still bounds a real hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1

      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"

      - name: Install pinned OpenCode runtime
        run: npm install --global opencode-ai@1.18.10

      - name: Install Claude Code runtime
        # This suite drives the real install pipeline end to end, so it needs
        # the real binary the same way it needs OpenCode above — axiom
        # itself no longer installs this (agentInstallStep in
        # internal/cli/run.go refuses instead), so CI installs what it needs
        # to test, same as any other test dependency. No exact-pin test
        # applies here the way TestOrganicRuntimeE2EUsesInstalledOpenCodePin
        # asserts for OpenCode: there is no versions.go constant backing this
        # one, since axiom's own display-only refusal for Claude Code
        # advises "latest" too (see internal/installcmd/resolver.go).
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Verify real-agent detection E2E is registered
        # organic_runtime_real_agent_detection_test.go is gated behind the
        # real_agent_e2e build tag precisely so `go test ./...` at the repo
        # root never runs it against whatever agent binaries happen to be on
        # that machine's PATH (see the file's own comment). That means this
        # job is its only runner, so a rename or a dropped -tags flag here
        # must fail loudly rather than let the suite silently stop proving
        # real Claude Code / OpenCode detection.
        shell: pwsh
        run: |
          $tests = go test -tags real_agent_e2e -list '^TestOrganicConfiguredAgentReceivesRoutingGuidanceRealAgents$' ./e2e/organicruntime
          if ($LASTEXITCODE -ne 0 -or $tests -notcontains 'TestOrganicConfiguredAgentReceivesRoutingGuidanceRealAgents') {
            throw 'Real-agent detection E2E is missing'
          }

      - name: Run organic journeys
        # No -run filter: a renamed test must fail this job loudly, never let
        # go test exit 0 having matched nothing. The gated real-agent journey
        # (TestRealAgentOrganicJourneys) is included via its env switch.
        # -tags real_agent_e2e additionally compiles in
        # TestOrganicConfiguredAgentReceivesRoutingGuidanceRealAgents, which
        # `go test ./...` never does — see that file's build-tag comment.
        env:
          AXIOM_REAL_AGENT_E2E: "1"
        run: go test -tags real_agent_e2e -v ./e2e/organicruntime -count=1 -timeout=25m

  e2e-tests:
    name: E2E Tests (${{ matrix.platform.name }})
    needs: go-format
    # Restringido a ejecución manual bajo demanda para evitar construcción pesada de 3 contenedores docker en PRs
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu
            dockerfile: Dockerfile.ubuntu
          - name: arch
            dockerfile: Dockerfile.arch
          - name: fedora
            dockerfile: Dockerfile.fedora
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1

      - name: Checkout exact event candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build E2E image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: e2e/${{ matrix.platform.dockerfile }}
          tags: axiom-e2e-${{ matrix.platform.name }}:ci
          load: true
          cache-from: type=gha,scope=e2e-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.platform.name }}

      # Full Tier 1+2+3 on every event (#2527): these checks are required by
      # the ruleset under the name "E2E Tests", so they must deliver the full
      # suite wherever they gate. Tiers 2-3 write only inside the container,
      # and push/schedule already prove they fit the step budget on the same
      # runners. Do not reintroduce per-event tier selection here without
      # renaming the checks to state the reduced scope.
      - name: Diagnose pinned OpenCode runtime before E2E
        run: |
          docker run --rm --pull=never --network none --entrypoint /bin/bash \
            axiom-e2e-${{ matrix.platform.name }}:ci -c '
              set -u
              export HOME=$(mktemp -d)
              export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data"
              export XDG_CACHE_HOME="$HOME/cache" XDG_STATE_HOME="$HOME/state"
              command -v opencode
              opencode --version
              result=$?
              printf "opencode version exit=%s\n" "$result"
              exit "$result"
            '

      - name: Run E2E tests
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_FULL_E2E: "1"
          RUN_BACKUP_TESTS: "1"
        run: |
          docker run --rm \
            -e RUN_FULL_E2E \
            -e RUN_BACKUP_TESTS \
            -e GITHUB_TOKEN \
            axiom-e2e-${{ matrix.platform.name }}:ci
