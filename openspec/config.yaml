# openspec/config.yaml
schema: spec-driven
language: "es"

context: |
  Axiom: Fork y version paralela de Gentle-AI.
  Tech stack: Go 1.25.10+, Bubbletea TUI (charmbracelet/bubbletea v1.3.10), lipgloss v1.1.0
  Architecture: cmd/ entrypoints, internal/ packages (agents, tui, model, pipeline, catalog, system, planner, verify, update, opencode, installcmd, cli, app, components, state, backup, assets, agentbuilder)
  Agents: multi-agent support (antigravity, opencode, claude, cursor, codex, gemini, vscode)
  Skills catalog: internal/catalog/skills.go — known skill registry; project skills in skills/
  Build: goreleaser (.goreleaser.yaml), CI: GitHub Actions (ci.yml, pr-check.yml, release.yml)
  Style: gofmt (standard), go vet, no golangci-lint config found
  Memoria persistente: Engram MCP (--project=axiom)
  IDIOMA OBLIGATORIO: Todos los artefactos de SDD deben redactarse en espanol (castellano).

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected internal/ packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex TUI flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Load go-testing skill when writing tests
    - Follow existing code patterns in internal/ packages
  verify:
    - "Run: go test <touched packages> -count=1, narrowed with -run; never internal/cli whole (the full suite runs in CI)"
    - "Run: go vet <touched packages>"
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: "2026-05-05"

  runner:
    command: "go test <touched packages> -count=1"
    framework: "Go standard testing"
    note: "Locally, only the touched packages (narrowed with -run); the full suite runs in CI"

  layers:
    unit:
      available: true
      tool: "go test"
      note: "132 test files across internal/ packages"
    integration:
      available: true
      tool: "net/http/httptest (built-in)"
    e2e:
      available: true
      tool: "go test -tags real_agent_e2e ./e2e/organicruntime"
      note: "Organic Runtime E2E: needs real Claude Code and OpenCode binaries; runs in the organic-runtime-e2e CI job"
    tui:
      available: true
      tool: "bubbletea tea.KeyMsg simulation (no teatest — direct model.Update() testing)"
      note: "TUI tests use direct Bubbletea model updates, not teatest library"

  coverage:
    available: true
    command: "go test -cover <touched packages>"

  quality:
    linter:
      available: false
      note: "No golangci-lint config found; go vet is available"
    type_checker:
      available: true
      command: "go vet ./..."
    formatter:
      available: true
      command: "gofmt"
